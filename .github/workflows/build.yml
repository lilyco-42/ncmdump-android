name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore for release build
        if: github.event.inputs.build_type == 'release'
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > ncmdump-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncmdump-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: >
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ncmdump-apk

      - name: Determine build type
        id: info
        run: |
          DATE=$(date '+%Y%m%d')
          RELEASE_APK=$(find . -name "app-release.apk" -print -quit)
          DEBUG_APK=$(find . -name "app-debug.apk" -print -quit)
          if [ -n "$RELEASE_APK" ]; then
            echo "tag=v${DATE}" >> "$GITHUB_OUTPUT"
            echo "name=ncmdump-v${DATE}-release" >> "$GITHUB_OUTPUT"
            echo "files=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEBUG_APK" ]; then
            echo "tag=v${DATE}-debug" >> "$GITHUB_OUTPUT"
            echo "name=ncmdump-v${DATE}-debug" >> "$GITHUB_OUTPUT"
            echo "files=${DEBUG_APK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          files: ${{ steps.info.outputs.files }}
          generate_release_notes: true
          make_latest: true
